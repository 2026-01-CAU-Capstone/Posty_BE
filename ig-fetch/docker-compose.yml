services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: posty
      POSTGRES_PASSWORD: posty
      POSTGRES_DB: posty
    ports:
      - "5432:5432"
    volumes:
      - posty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posty -d posty"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  posty_pgdata:
